name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: node --test tests/*.test.mjs
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: foundry-module
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foundry-module
          path: dist
      - name: Verify tag
        run: node -e 'const m=require("./module.json");if(process.env.GITHUB_REF_NAME!=="v"+m.version)process.exit(1)'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "D&D DM-Dashboard Exporter $GITHUB_REF_NAME" --notes-file CHANGELOG.md dist/*.zip dist/module.json dist/SHA256SUMS.txt
